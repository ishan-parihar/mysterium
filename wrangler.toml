# Cloudflare Workers/Pages configuration for Mysterium.
#
# This file declares the KV namespaces and Analytics Engine binding
# that the BFF endpoints (/api/save, /api/recovery, /api/telemetry)
# use via platform.env in SvelteKit +server.ts handlers.
#
# Deploy: npx wrangler pages deploy .svelte-kit/cloudflare --project-name mysterium
# Secrets: npx wrangler secret put LLM_API_KEY
#
# See: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "mysterium"
compatibility_date = "2024-11-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

# ─── KV Namespaces ─────────────────────────────────────────────────
# Create before first deploy:
#   npx wrangler kv namespace create SAVE_KV
#   npx wrangler kv namespace create RECOVERY_KV
# Then paste the returned IDs below.

[[kv_namespaces]]
binding = "SAVE_KV"
id = "debf2638a10c4b4888c14c82ad104add"
preview_id = "28fca022c946400d81d8216e33179e4b"

[[kv_namespaces]]
binding = "RECOVERY_KV"
id = "8ab82fa3ed034c6dad487265df721a47"
preview_id = "c1e76bd37fe84e4196b5689cdf13b25c"

# ─── Analytics Engine (telemetry) — NOT YET BOUND ──────────────────
# `npx wrangler pages deploy` FAILS the whole deployment if this binding is declared and the
# account has not enabled Analytics Engine (dash.cloudflare.com → Workers → Analytics Engine).
# Measured, not assumed: the first deploy attempt died on exactly that.
#
# Nothing is lost by leaving it out. `/api/telemetry/+server.ts:81` already degrades — it writes
# through `platform.env.ANALYTICS` when the binding exists and otherwise logs to the console, so
# the endpoint works either way. Telemetry is opt-in and OFF by default (`telemetryStore.ts:47`),
# so no binding means no events are sent at all until an owner opts in.
#
# To bind it later: enable Analytics Engine in the dashboard, then uncomment the block below.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "mysterium_telemetry"

# ─── Secrets (set via CLI, NOT in this file) ───────────────────────
# LLM_API_KEY — the OpenAI/Anthropic API key. Set via:
#   npx wrangler secret put LLM_API_KEY
# Never commit secrets to wrangler.toml.
