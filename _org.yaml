  P2: "foundations/44 + canon router + 02 MHC + objective + AGENTS.md external canon"
  P3: "docs/architecture -> docs/system (13 organs) + R1-R9 + link rewrite"
  P4: "scripts/arch.py (route/recon/new/seed/log/emit/validate, DG1-DG10)"
  P5: "23 records seeded with ledger receipts (seed-2026-09-20.yaml)"
  P6: "docs/historical/ quarantine + generated INDEX + README demoted to pointer"

pending:
  CODE-PASS: "rename the 8 stage identifiers (src/core/assessments/*/white.ts, the Stage union, threshold maps, fixtures) atomically with their tests; regenerate src/core/data/concept-drafts.json in the same commit"
