  KB-SKILLS-PROVENANCE: "mark which skills/ entries are house governance (workspace-lint, curriculum-linter) vs vendored third-party (134 tracked files: ui-styling, ui-ux-pro-max, design-taste-frontend) (KB audit UT-9)"
  KB-VALIDATE-JSON: "`arch.py validate --json` so CI, dashboards and agents can consume gate results; and an index artifact so validation stops being full-scan-per-gate (KB audit UT-10)"
  KB-FOUNDATIONS-INGEST: "no mechanical link exists between a foundation doc's contract and the code that must satisfy it, beyond contract_docs pointers — the reason RT-9 and MY-RG-0005 can exist (KB audit UT-11)"
  RT-CANON-SHORTHAND: "canon documents cite each other as `NN §X` shorthand, and no edge extractor resolves that form (outbound_refs reads links, backticked paths and .md paths only). Consequence: the canon rung's doc→doc graph is effectively inbound-only — `arch.py related docs/foundations/45-...` reports `(none)` outbound while the document in fact depends on 18/22/24 — so editing a foundation doc is not shown what else it affects. Fix: resolve the shorthand as an edge class (and, if it becomes load-bearing, gate it). Found while writing 47, which now carries explicit §14 references as the workaround"
