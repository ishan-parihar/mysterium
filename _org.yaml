  RT-ORPHAN-LAW: "gate: an Active AD with no code anchor and no declared deferral is invisible pending work; the largest untracked backlog in the repo (red-team 2026-09-20 section 2). Needs a `Deferral:` or `Consumer:` field on the record so a law with no consumer is a violation rather than a note"
  PLAN-IMPLEMENT: "the architecture ratified in 45 (user-dimensionality vector, three-library pooling, analogical bridge, engagement register), 46 (facets, tag store, dialectic engine, composition) and 47 (evidence tiers, interest record, scaffold library), plus the safety ethics contract (data classes, projection firewall), has no code yet — MY-AD-0018, MY-AD-0019, MY-AD-0020, MY-AD-0021, MY-AD-0022, MY-AD-0023, MY-RG-0017, MY-RG-0018, MY-RG-0019, MY-RG-0020, MY-RG-0021. Sequenced as Phase 10 in DEVELOPMENT-PLAN"
  SCHEDULER-FORMULA: "reconcile the implementation with the ratified formula (24 section 3.2.9, MY-AD-0025): src/core/engines/PriorityComputation.ts carries userMatrixTargeting 0.12 as an eighth additive WEIGHT (canon's eighth criterion is masteryAlignment 0.10, which has no implementation anywhere) plus six unweighted additive terms after the weighted sum (noveltyBonus <=0.25, weaknessBonus <=0.15, diversityBonus +/-0.10, bleedBoost <=0.15, rayBoost <=0.05, tieBreaker <=0.02) - up to +0.72 against a base score bounded by 1.00, so the bonuses govern selection and the ratified weights largely do not. Also: the file's header comment still transcribes the pre-2026-09-17 seven-criterion formula, and computeThetaUrgency returns 1 for a never-visited cell where canon returns 0.0. Close with G26 (weights sum to exactly 1.00; no additive term outside the eight criteria); the change moves selection behaviour, so personas and the kernel battery must be re-verified in the same commit"
  REPORTING-FEED: "the loop's centrepiece has no owner: 43 section 4.5b routes session signals and worker proposals into a \"reporting feed\" named exactly once in the whole set, with no interface, no type, no consumer list and no gate - so the orchestrator -> sub-agents -> reporting -> orchestrator cycle (MY-AD-0010, 43 sections 4.5b/4.6/5.1-5.4) is specified as doctrine but not as a contract. Needed: the feed's record shape (what one entry carries), its four writers (session end, worker job, ratification, ledger) and its three readers (27 planning, 25 CCI, 16 section 10.4 projections), so 22's owner workers and 45/46's composition can be verified against it"
  PROFILE-INFERENCE: "the scaffold library and its selection rule (47 section 6) and the inference pipeline (47 section 8) have no code: no probe set, no evidence ledger, no tier gate, no scaffold store. The nine executable checks of 47 section 9 are the gate fixtures to write first; check 6 (no write path from inference to player state other than the UDV) is the structural form of the 47 section 2 red line"
  WORLD-STORE-MOVE: "create src/core/world/ (store, facets, tags, compose, libraries) and move the world content into it: domain/Holon.ts, data/HolonRegistry.ts, data/{stage-holons,red-layer-holons}.json, data/RedPESTLE.ts, data/encounters/ (46 section 10). Correct organs.world.code (currently cohort pods) and remove src/core/data from platform. This is what makes 18/21/22/45/46 reachable from the code they govern (KB-FOUNDATIONS-INGEST)"
  FACET-COMPILER: "compile the 512 concept-drafts into the facet store (46 section 8) so the corpus stays prose-for-humans and the store stays data-for-the-engine; the compiler is the only path, which is what keeps them from diverging (RT-CORPUS-RECONCILE)"
  TAG-ONTOLOGY: "author the initial tag set with axis positions and the curated dialectic pairs (46 section 4); a tag without a resolvable opposite is a compile error"
  KB-ORPHAN-TRIAGE: "mark the 11 orphan scripts as historical / current / one-shot-in-place; 4 of them rewrite the corpus for superseded templates and would be destructive if run (KB audit UT-7). Also fix scripts/run-validation-benchmark.ts, which names the removed docs/validation/ path"
