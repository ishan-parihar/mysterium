    code: [src/core/world, src/core/data/encounters]
    status: active
    note: "No architecture doc existed before this plan (audit gap G6). Corrected 2026-09-21 (WORLD-STORE-MOVE): pods moved to the cohort organ (38); the world's content moved out of src/core/data into src/core/world/ per 46 section 10. src/core/data/encounters/red/ remains the hand-authored Red layer until FACET-COMPILER replaces it with compiled facets (46 section 10)."

  onboarding:
    contract_docs: [foundations/21-incarnation-architecture, foundations/16-significator-architecture]
    code: [src/core/onboarding, src/core/adaptive]
    status: active

  persistence:
    contract_docs: [foundations/43-agentic-orchestration-architecture]
    code: [src/infra/persistence, src/infra/native, src/infra/crypto, src/infra/profiles]
    status: active

  presentation:
    contract_docs: [foundations/33-self-directed-dashboard, foundations/20-veil-of-forgetting]
