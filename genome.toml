# genome.toml — modules on, role → path map, module settings. Edit freely.
[genome]
schema_version = 2
modules = ["core", "records", "research", "ops", "agents"]

[paths]
agents = "AGENTS.md"
state = "docs/handoff/STATE.md"
entry = "docs/handoff/README.md"
register = "TODO.md"
ledger = "docs/kb/CLOSED.md"
worklog = "docs/kb/WORKLOG.md"
asks = "docs/kb/ASKS.md"
plans = "docs/plans"
audits = "docs/audit"
runbook = "README.md#Development"
archive = "docs/archive"
readme = "README.md"
docs = "docs"
decisions = "docs/system/core/decisions"
regressions = "docs/system/core/regressions"
records_index = "docs/RECORDS.md"
evidence = "evidence"
hypotheses = "docs/kb/HYPOTHESES.md"
quarantine = "docs/kb/QUARANTINE.md"
prereg = "docs/kb/PREREG.md"
ownership_map = "docs/INDEX.md"
feed = "docs/kb/feed.md"
workflows = "docs/kb/workflows"

[core]
gate = "bun test"
worklog_form = "file"      # or "numbered" (worklog = a directory of NNNN-date-slug.md + INDEX.md)
archive_form = "flat"      # or "generations" (archive/<generation>/ + README manifest, no tombstones)
living_plans = []          # plans that evolve (phase rows, a 'Resume here' section)
# resume = "docs/plans/<living-plan>.md#Resume here"   # what `genome wake` shows
budgets = {}               # e.g. { "AGENTS.md" = 60000 } — bytes; entry surfaces stay cheap to read
emitters = []              # extra commands `genome close` runs to regenerate derived files
checklist = ["manuals with `covers` reviewed against their code"]             # judgement items `genome close` reminds you of
never_commit = []          # globs `genome close` leaves out of the named-path commit list

[records]
prefix = "MY"              # MY-AD-0038 / MY-RG-0035 — the records live under docs/system/core/
width = 4                  # the same 4-digit form scripts/arch.py mints, so the two writers agree
mode = "immutable"         # or "amendable" (dated ## Amendment sections)

[research]
classes = ["CERT", "FORWARD", "LIVE", "OUT-OF-SAMPLE", "IN-SAMPLE"]
surfaces = []              # globs where every figure needs a class (default: state + agents)

[ops]
owner_globs = []           # doc locations that must be listed in the ownership map
link_surfaces = []         # docs whose backticked paths must exist
link_prefixes = []         # e.g. ["docs/", "scripts/"]: any backticked path starting so is checked, dirs too
code_globs = []            # code that must be reachable from a live surface
code_roots = []            # files whose mentions make code live (bin/, tests/, ...)
bulk_globs = ["**/*.parquet", "**/*.pkl", "**/*.npz"]
max_bytes = 5000000
secrets = []               # e.g. [".env:API_KEY", "~/.config/x/token"] — scanned in diffs, never printed
# jobs = "bin/jobs status"   # shown by `genome wake`

[drift]
warn_until = "2026-11-18"  # warn until rollout+30d; after it a stale manual blocks close

[card]
status_into = "docs/handoff/STATE.md"
architecture = "docs/system/AGENTS.md"
# the 71 AD/RG records live in two homes (docs/system/core/ and each organ's core/),
# which the genome records module cannot hold. docs/INDEX.md is the generated index
# over all of them, and the section anchor names the table.
decisions = "docs/INDEX.md#Records (71)"
